# The design canvas's frames against the page as built. A frame under
# docs/design/canvas/project holds the page's own markup and the stylesheet
# rules it uses (scripts/canvas.sh), so a pull request that changes the page
# and not the frames leaves them stale. This builds every frame from the
# pull request's page, in the runner's headless Chrome, and fails naming
# the ones that differ from the committed files.
#
# A frame's height, the data month and the release's hash are left out of
# the comparison: the runner's fonts and go.mod's pin set them. So the
# refresh's bump of the month does not run this, and does not fail it.
#
# The check cannot see the canvas itself. Publishing the rebuilt frames
# stays with the loop in AGENTS.md ("Design Canvas").
#
# Frames is a required status check of main's ruleset, so it reports on
# every pull request: the workflow has no path filter, which would leave a
# pull request that touches none of the paths waiting on a check that never
# starts. Changed paths decides instead, and Frames is skipped, which the
# ruleset counts as passing, when the page, the script and the frames are
# all untouched.
name: Canvas

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frames: ${{ steps.paths.outputs.frames }}
    steps:
      # As import.yml: the files the branch changes since it left the base,
      # from the compare API, with no checkout. 300 is the most it lists; at
      # that, build the frames.
      - id: paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          frames=false
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files // [] | .[].filename')
          n=$(grep -c . <<<"$files" || true)
          echo "$n files changed since $BASE"
          if [ "$n" -ge 300 ]; then
            frames=true
          fi
          while IFS= read -r f; do
            case "$f" in
              *.md | *_test.go) ;;
              pkg/ui/* | scripts/canvas.sh | scripts/canvas/* | scripts/sw.sh | docs/design/canvas/project/* | .github/actions/mise/* | .github/workflows/canvas.yml)
                echo "Frames: $f"
                frames=true ;;
            esac
          done <<<"$files"
          echo "frames=$frames" | tee -a "$GITHUB_OUTPUT"

  frames:
    name: Frames
    needs: changes
    # Skipped only on a plain "false": were Changed paths to fail, a skip
    # here would pass the required check unbuilt.
    if: ${{ !cancelled() && needs.changes.outputs.frames != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        with:
          tools: go node
      - run: scripts/canvas.sh --check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canvas-frames-as-built
          path: build/canvas/*.dc.html
          if-no-files-found: ignore
