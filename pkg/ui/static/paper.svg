<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
<!-- Paper stock's tooth: fine noise, brown, its alpha the speck. The stylesheet lays it over the manila of a tag. It tiles (stitchTiles). -->
<filter id="p" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" stitchTiles="stitch"/>
<feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.1  0.5 0 0 0 -0.12"/>
</filter>
<rect width="100%" height="100%" filter="url(#p)"/>
</svg>
